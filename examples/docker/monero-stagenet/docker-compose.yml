services:
  # PostgreSQL Database
  db:
    build:
      context: ../../../db
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miningcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-miningcore}
    volumes:
      - monero-stagenet-db:/var/lib/postgresql/data
      - ../../../src/Miningcore/Persistence/Postgres/Scripts/createdb.sql:/miningcore/createdb.sql:ro
      - ../../../src/Miningcore/Persistence/Postgres/Scripts/createdb_postgresql_11_appendix.sql:/miningcore/createdb_postgresql_11_appendix.sql:ro
    networks:
      - monero-stagenet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-miningcore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Monero Daemon (stagenet mode)
  monerod:
    image: sethsimmons/simple-monerod:latest
    command:
      - --stagenet
      - --non-interactive
      - --confirm-external-bind
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=38081
      - --rpc-access-control-origins=*
      - --zmq-pub=tcp://0.0.0.0:38082
      - --disable-rpc-ban
      - --no-igd
      - --log-level=1
      - --p2p-bind-ip=0.0.0.0
      - --p2p-bind-port=38080
    volumes:
      - monero-stagenet-data:/home/monero/.bitmonero
    networks:
      - monero-stagenet
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:38081/json_rpc -d '{\"jsonrpc\":\"2.0\",\"id\":\"0\",\"method\":\"get_info\"}' | grep -q result"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G

  # Monero Wallet RPC
  monero-wallet-rpc:
    image: sethsimmons/simple-monerod:latest
    command:
      - monero-wallet-rpc
      - --stagenet
      - --daemon-host=monerod
      - --daemon-port=38081
      - --rpc-bind-ip=0.0.0.0
      - --rpc-bind-port=38083
      - --disable-rpc-login
      - --wallet-file=/wallet/pool-wallet
      - --password=''
      - --confirm-external-bind
      - --log-level=1
    volumes:
      - monero-wallet-data:/wallet
    networks:
      - monero-stagenet
    depends_on:
      monerod:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:38083/json_rpc -d '{\"jsonrpc\":\"2.0\",\"id\":\"0\",\"method\":\"get_balance\"}' | grep -q result"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Miningcore Pool
  miningcore:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      CONFIG_PATH: /config.json
    configs:
      - source: miningcore-config
        target: /config.json
    depends_on:
      db:
        condition: service_healthy
      monerod:
        condition: service_healthy
      monero-wallet-rpc:
        condition: service_healthy
    ports:
      - "${STRATUM_PORT:-3034}:3034"
      - "${API_PORT:-4002}:4000"
    networks:
      - monero-stagenet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/pools"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 2G

  # pgAdmin (Optional - for database inspection)
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@miningcore.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "${PGADMIN_PORT:-5052}:5050"
    networks:
      - monero-stagenet
    profiles:
      - debug
    depends_on:
      - db

networks:
  monero-stagenet:
    driver: bridge

volumes:
  monero-stagenet-db:
  monero-stagenet-data:
  monero-wallet-data:

configs:
  miningcore-config:
    file: ./config.json
