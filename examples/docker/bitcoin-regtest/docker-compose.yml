services:
  # PostgreSQL Database
  db:
    build:
      context: ../../../db
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-miningcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-miningcore}
    volumes:
      - bitcoin-regtest-db:/var/lib/postgresql/data
      - ../../../src/Miningcore/Persistence/Postgres/Scripts/createdb.sql:/miningcore/createdb.sql:ro
      - ../../../src/Miningcore/Persistence/Postgres/Scripts/createdb_postgresql_11_appendix.sql:/miningcore/createdb_postgresql_11_appendix.sql:ro
    networks:
      - bitcoin-regtest
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-miningcore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Bitcoin Node (regtest mode)
  bitcoind:
    image: btcpayserver/bitcoin:29.1
    command:
      - bitcoind
      - -regtest
      - -server
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=${BTC_RPC_USER:-bitcoin}
      - -rpcpassword=${BTC_RPC_PASSWORD:-bitcoin}
      - -zmqpubhashblock=tcp://0.0.0.0:28332
      - -zmqpubrawtx=tcp://0.0.0.0:28333
      - -txindex=1
      - -printtoconsole
      - -debug=rpc
    volumes:
      - bitcoin-regtest-data:/data
    networks:
      - bitcoin-regtest
    healthcheck:
      test: ["CMD-SHELL", "bitcoin-cli -regtest -rpcuser=$${BTC_RPC_USER:-bitcoin} -rpcpassword=$${BTC_RPC_PASSWORD:-bitcoin} getblockchaininfo"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Miningcore Pool
  miningcore:
    build:
      context: ../../..
      dockerfile: Dockerfile
    environment:
      CONFIG_PATH: /config.json
    configs:
      - source: miningcore-config
        target: /config.json
    depends_on:
      db:
        condition: service_healthy
      bitcoind:
        condition: service_healthy
    ports:
      - "${STRATUM_PORT:-3032}:3032"
      - "${API_PORT:-4000}:4000"
    networks:
      - bitcoin-regtest
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/pools"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G

  # pgAdmin (Optional - for database inspection)
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@miningcore.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "${PGADMIN_PORT:-5050}:5050"
    networks:
      - bitcoin-regtest
    profiles:
      - debug
    depends_on:
      - db

networks:
  bitcoin-regtest:
    driver: bridge

volumes:
  bitcoin-regtest-db:
  bitcoin-regtest-data:

configs:
  miningcore-config:
    file: ./config.json
